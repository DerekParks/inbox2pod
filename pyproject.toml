[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inbox2pod"
version = "0.1.0"
description = "Turn email newsletters into a self-hosted podcast feed"
readme = "README.md"
authors = [{ name = "Derek Parks", email = "dnparks@gmail.com" }]
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "aiosmtpd==1.4.6",
    "APScheduler==3.11.3",
    "beautifulsoup4==4.15.0",
    "feedgen==1.0.0",
    "flask-restx==1.3.2",
    "ftfy==6.3.1",
    "html2text==2025.4.15",
    "imap-tools==1.15.1",
    "lxml==6.1.3",
    "readability-lxml==0.9",
    "requests==2.32.5",
    "SQLAlchemy>=2.0.28",
    "trafilatura==2.3.1",
    "waitress==3.0.2",
    "wakeonlan==4.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "requests-mock", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["inbox2pod"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
exclude = [".git", "__pycache__", ".mypy_cache", ".pytest_cache"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long
    "C901", # comprehension is too complex
    "W191", # indentation contains tabs
]
unfixable = ["F841"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["UP012"] # charset-explicit .encode("utf-8") reads better in encoding tests
