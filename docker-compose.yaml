services:
  inbox2pod:
    image: ghcr.io/derekparks/inbox2pod:latest
    container_name: inbox2pod
    restart: unless-stopped
    ports:
      - "5003:5003"

      # SMTP receiver mode (SMTP_ENABLED=true). The container listens on 2525 so
      # it does not need root; map whatever host port you actually want to feed.
      # - "25:2525"

    env_file:
      - .env

    volumes:
      # database, stored .eml files and synthesized audio
      - ./data:/app/data

      # uncomment to use your own cover art (must be at least 1400x1400)
      # - ./cover.png:/app/inbox2pod/cover.png:ro

